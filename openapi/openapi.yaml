                        required:
                          - name
                          - description
                          - type
                    retentionDays:
                      type: integer
                      minimum: 1
                      maximum: 3650
                  required:
                    - systemPrompt
                  additionalProperties: false
                note:
                  type: string
                  maxLength: 200
                knowledgeBaseIds:
                  maxItems: 20
                  type: array
                  items:
                    type: string
                    maxLength: 40
                toolIds:
                  maxItems: 30
                  type: array
                  items:
                    type: string
                    maxLength: 40
              additionalProperties: false
      responses:
        "200":
          description: "Success: { success: true, data, meta }"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - agents
      summary: DELETE /orgs/{orgId}/agents/{agentId}
      operationId: delete__orgs_orgId_agents_agentId
      description: Requires permission `agents:write` in the organization.
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - name: orgId
          in: path
