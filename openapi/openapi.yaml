openapi: 3.0.3
info:
  title: Voice Agent SaaS API
  version: 0.2.0
  description: "Generated from the live route table and Zod validators. Success: `{success:true,data,meta}`. Error: `{success:false,error:{code,message},requestId}`. Tenant routes live under /orgs/{orgId}; access is decided server-side from membership (users) or the bound organization (API keys). POST endpoints that move money or start calls accept an `Idempotency-Key` header."
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
        requestId:
          type: string
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
paths:
  /admin/billing/reconcile:
    post:
      tags:
        - admin
      summary: POST /admin/billing/reconcile
      operationId: post__admin_billing_reconcile
      security:
        - bearerAuth: []
        - apiKey: []
      responses:
        "200":
          description: "Success: { success: true, data, meta }"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /admin/orgs:
    get:
      tags:
        - admin
      summary: GET /admin/orgs
      operationId: get__admin_orgs
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            default: 25
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 40
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: "Success: { success: true, data, meta }"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /admin/orgs/{id}:
    get:
      tags:
        - admin
      summary: GET /admin/orgs/{id}
      operationId: get__admin_orgs_id
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Success: { success: true, data, meta }"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /admin/orgs/{id}/credits:
    post:
      tags:
        - admin
      summary: POST /admin/orgs/{id}/credits
      operationId: post__admin_orgs_id_credits
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amountMinor:
                  type: integer
                  minimum: 1
                  maximum: 10000000
                reason:
                  type: string
                  minLength: 3
                  maxLength: 200
                idempotencyKey:
                  type: string
                  minLength: 8
                  maxLength: 100
              required:
                - amountMinor
                - reason
                - idempotencyKey
      responses:
        "200":
          description: "Success: { success: true, data, meta }"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /admin/orgs/{id}/suspend:
    post:
      tags:
        - admin
      summary: POST /admin/orgs/{id}/suspend
      operationId: post__admin_orgs_id_suspend
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Success: { success: true, data, meta }"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /admin/orgs/{id}/unsuspend:
    post:
      tags:
        - admin
      summary: POST /admin/orgs/{id}/unsuspend
      operationId: post__admin_orgs_id_unsuspend
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Success: { success: true, data, meta }"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /admin/system/health:
    get:
      tags:
        - admin
      summary: GET /admin/system/health
      operationId: get__admin_system_health
      security:
        - bearerAuth: []
        - apiKey: []
      responses:
        "200":
          description: "Success: { success: true, data, meta }"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /admin/webhook-events:
    get:
      tags:
        - admin
      summary: GET /admin/webhook-events
      operationId: get__admin_webhook_events
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            default: 25
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 40
        - name: unprocessed
          in: query
          required: false
          schema:
            default: "true"
            type: string
            enum:
              - "true"
              - "false"
      responses:
        "200":
          description: "Success: { success: true, data, meta }"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /admin/webhook-events/{id}/retry:
    post:
      tags:
        - admin
