        "401":
          $ref: "#/components/responses/Error"
  /orgs/{orgId}:
    get:
      tags:
        - misc
      summary: GET /orgs/{orgId}
      operationId: get__orgs_orgId
      description: Requires permission `org:read` in the organization.
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Success: { success: true, data, meta }"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - misc
      summary: PATCH /orgs/{orgId}
      operationId: patch__orgs_orgId
      description: Requires permission `org:update` in the organization.
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                retentionDays:
                  type: integer
                  minimum: 1
                  maximum: 3650
                settings:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties: {}
              additionalProperties: false
      responses:
        "200":
          description: "Success: { success: true, data, meta }"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /orgs/{orgId}/agents:
    get:
      tags:
        - agents
      summary: GET /orgs/{orgId}/agents
      operationId: get__orgs_orgId_agents
      description: Requires permission `agents:read` in the organization.
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            default: 25
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 40
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - DRAFT
              - PUBLISHED
              - ARCHIVED
      responses:
        "200":
          description: "Success: { success: true, data, meta }"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - agents
      summary: POST /orgs/{orgId}/agents
      operationId: post__orgs_orgId_agents
      description: Requires permission `agents:write` in the organization.
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                config:
                  type: object
                  properties:
                    systemPrompt:
                      type: string
                      minLength: 1
                      maxLength: 20000
                    greeting:
                      type: string
                      maxLength: 1000
                    language:
                      default: en
                      type: string
                      minLength: 2
                      maxLength: 10
                    voice:
                      type: object
                      properties:
                        provider:
                          default: 11labs
                          type: string
                          maxLength: 40
                        voiceId:
                          type: string
                          maxLength: 100
                      required:
                        - voiceId
                    model:
                      default: {}
                      type: object
                      properties:
                        name:
                          default: gpt-4o-mini
                          type: string
                          maxLength: 100
                        temperature:
                          default: 0.3
                          type: number
                          minimum: 0
                          maximum: 2
                        maxTokens:
                          default: 500
                          type: integer
                          minimum: 50
                          maximum: 4000
                    interruptionSensitivity:
                      default: 0.5
                      type: number
                      minimum: 0
                      maximum: 1
                    silenceTimeoutSeconds:
                      default: 20
                      type: integer
                      minimum: 5
                      maximum: 120
                    maxCallDurationSeconds:
                      default: 900
                      type: integer
                      minimum: 30
                      maximum: 7200
                    transferRules:
                      default: []
                      maxItems: 10
                      type: array
                      items:
                        type: object
                        properties:
                          phoneNumber:
                            type: string
                            pattern: ^\+[1-9]\d{6,14}$
                          condition:
                            type: string
                            maxLength: 300
                        required:
                          - phoneNumber
                          - condition
                    extraction:
                      default: []
                      maxItems: 20
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            pattern: ^[a-z_][a-z0-9_]{0,40}$
                          description:
                            type: string
                            maxLength: 300
                          type:
                            type: string
                            enum:
                              - string
                              - number
                              - boolean
                        required:
                          - name
                          - description
                          - type
                    retentionDays:
                      type: integer
                      minimum: 1
                      maximum: 3650
                  required:
                    - systemPrompt
                  additionalProperties: false
                knowledgeBaseIds:
                  default: []
                  maxItems: 20
                  type: array
                  items:
                    type: string
                    maxLength: 40
                toolIds:
                  default: []
                  maxItems: 30
                  type: array
                  items:
                    type: string
                    maxLength: 40
              required:
                - name
                - config
      responses:
        "201":
          description: "Success: { success: true, data, meta }"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
