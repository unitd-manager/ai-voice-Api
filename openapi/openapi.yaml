      responses:
        "200":
          description: "Success: { success: true, data, meta }"
        "400":
          $ref: "#/components/responses/Error"
  /orgs:
    get:
      tags:
        - orgs
      summary: GET /orgs
      operationId: get__orgs
      security:
        - bearerAuth: []
        - apiKey: []
      responses:
        "200":
          description: "Success: { success: true, data, meta }"
        "400":
