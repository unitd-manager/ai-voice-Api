            type: string
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                config:
                  type: object
                  properties:
                    systemPrompt:
                      type: string
                      minLength: 1
                      maxLength: 20000
                    greeting:
                      type: string
                      maxLength: 1000
                    language:
                      default: en
                      type: string
                      minLength: 2
                      maxLength: 10
                    voice:
                      type: object
                      properties:
                        provider:
                          default: 11labs
                          type: string
                          maxLength: 40
                        voiceId:
                          type: string
                          maxLength: 100
                      required:
                        - voiceId
                    model:
                      default: {}
                      type: object
                      properties:
                        name:
                          default: gpt-4o-mini
                          type: string
                          maxLength: 100
                        temperature:
                          default: 0.3
                          type: number
                          minimum: 0
                          maximum: 2
                        maxTokens:
                          default: 500
                          type: integer
                          minimum: 50
                          maximum: 4000
                    interruptionSensitivity:
                      default: 0.5
                      type: number
                      minimum: 0
                      maximum: 1
                    silenceTimeoutSeconds:
                      default: 20
                      type: integer
                      minimum: 5
                      maximum: 120
                    maxCallDurationSeconds:
                      default: 900
                      type: integer
                      minimum: 30
                      maximum: 7200
                    transferRules:
                      default: []
                      maxItems: 10
                      type: array
                      items:
                        type: object
                        properties:
                          phoneNumber:
                            type: string
                            pattern: ^\+[1-9]\d{6,14}$
                          condition:
                            type: string
                            maxLength: 300
                        required:
                          - phoneNumber
                          - condition
                    extraction:
                      default: []
                      maxItems: 20
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            pattern: ^[a-z_][a-z0-9_]{0,40}$
                          description:
                            type: string
                            maxLength: 300
                          type:
                            type: string
                            enum:
                              - string
                              - number
