      responses:
        "200":
          description: "Success: { success: true, data, meta }"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /auth/forgot-password:
    post:
      tags:
        - auth
      summary: POST /auth/forgot-password
      operationId: post__auth_forgot_password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
              required:
                - email
      responses:
        "200":
          description: "Success: { success: true, data, meta }"
        "400":
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      tags:
        - auth
      summary: POST /auth/login
      operationId: post__auth_login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
              required:
                - email
                - password
      responses:
        "200":
          description: "Success: { success: true, data, meta }"
        "400":
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      tags:
        - auth
      summary: POST /auth/logout
      operationId: post__auth_logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 20
                  maxLength: 200
              required:
                - refreshToken
      responses:
        "200":
          description: "Success: { success: true, data, meta }"
        "400":
          $ref: "#/components/responses/Error"
  /auth/refresh:
    post:
      tags:
        - auth
      summary: POST /auth/refresh
      operationId: post__auth_refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 20
                  maxLength: 200
              required:
                - refreshToken
      responses:
        "200":
          description: "Success: { success: true, data, meta }"
        "400":
          $ref: "#/components/responses/Error"
  /auth/register:
    post:
      tags:
        - auth
      summary: POST /auth/register
      operationId: post__auth_register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                password:
                  type: string
                  minLength: 10
                  maxLength: 128
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                organizationName:
                  type: string
                  minLength: 2
                  maxLength: 100
              required:
                - email
                - password
      responses:
        "201":
          description: "Success: { success: true, data, meta }"
        "400":
          $ref: "#/components/responses/Error"
  /auth/reset-password:
    post:
